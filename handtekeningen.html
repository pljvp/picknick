<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Behoud onze picknicktafels en fietsen</title>
<style>
  :root {
    --bg:#111112; --surface:#1c1c1e; --line:#2a2a2c; --ink:#f1f1ee; --muted:#9b9b97;
    --accent:#f1f1ee; --on-accent:#111112; --focus:#9ab8ff; --bad:#ffb454; --go:#5cc47c; --on-go:#0c1a10;
    --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --radius:2px; --header-h:56px; --tab-h:44px;
  }
  :root[data-theme=light] {
    --bg:#f5f4f0; --surface:#eae9e4; --line:#d9d8d2; --ink:#151515; --muted:#66665f;
    --accent:#151515; --on-accent:#f5f4f0; --focus:#2b59c3; --bad:#b45309; --go:#1b7a3a; --on-go:#f5f4f0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px); margin:0; background:var(--bg); color:var(--ink); font:16px/24px var(--sans); }
  .wrap { max-width:560px; margin:0 auto; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  /* Kop */
  .bar { position:sticky; top:0; z-index:3; height:calc(var(--header-h) + env(safe-area-inset-top, 0px)); padding-top:env(safe-area-inset-top, 0px); background:var(--bg); }
  .bar .wrap { height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 4px 0 16px; }
  .label { font:500 11px/16px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .icons { display:flex; }
  .icon { width:44px; height:44px; padding:0; border:0; border-radius:var(--radius); background:transparent; color:var(--ink); font:22px/1 var(--sans); cursor:pointer; display:grid; place-items:center; }
  h1 { margin:0; padding:16px 16px 24px; font:600 28px/32px var(--sans); }

  /* Tabs */
  .tabs { position:sticky; top:calc(var(--header-h) + env(safe-area-inset-top, 0px)); z-index:2; background:var(--bg); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--line); }
  .tabs button { height:var(--tab-h); min-width:0; padding:0; border:0; border-radius:0; background:none; color:var(--muted); font:600 clamp(12px,3.6vw,15px)/20px var(--sans); white-space:nowrap; cursor:pointer; }
  .tabs button[aria-selected=true] { color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent); }

  /* Inhoud */
  .panel { padding:24px 16px 120px; }
  .panel[hidden] { display:none; }
  .story { margin:0 0 16px; font:400 16px/24px var(--sans); }
  .story:last-child { margin-bottom:0; }
  .story a { color:var(--ink); text-decoration:underline; }
  .item { display:grid; grid-template-columns:2.25em 1fr; gap:8px; margin:0 0 16px; }
  .num { padding-top:2px; font:400 13px/20px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
  .item a { color:var(--ink); text-decoration:underline; }
  .plain { margin:0; }
  .plain.misuse { margin-top:16px; }

  /* Formulier */
  .intro { margin:0 0 24px; }
  .field { margin:0 0 24px; }
  .addr { display:grid; grid-template-columns:minmax(0,1fr) 132px; gap:12px; }
  .field .label { display:block; margin:0 0 8px; }
  .hint { margin:4px 0 0; font:400 13px/18px var(--sans); color:var(--muted); }
  input[type=text], textarea { display:block; width:100%; border:0; border-radius:var(--radius); background:var(--surface); color:var(--ink); font:16px/24px var(--sans); }
  input[type=text] { height:44px; padding:0 12px; }
  textarea { min-height:88px; padding:10px 12px; resize:vertical; }
  .pad { position:relative; background:var(--surface); border-radius:var(--radius); }
  canvas { display:block; width:100%; height:160px; touch-action:none; }
  .pad .draw { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); pointer-events:none; }
  .padx { position:absolute; top:0; right:0; color:var(--muted); }
  .invalid { box-shadow:inset 0 -2px 0 var(--bad); }
  .msg { min-height:18px; margin:0 0 16px; font:400 13px/18px var(--sans); color:var(--muted); }
  .msg.err { color:var(--bad); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row .wide { grid-column:1 / -1; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 10px; border:0; border-radius:var(--radius); background:var(--surface); color:var(--ink); font:600 15px/20px var(--sans); white-space:nowrap; cursor:pointer; }
  .clip { position:relative; margin:0 0 20px; }
  .clipimg { height:200px; overflow:hidden; background:var(--surface); border-radius:var(--radius); }
  .clipimg img { display:block; width:100%; height:auto; filter:contrast(1.04) brightness(.88); }
  :root[data-theme=light] .clipimg img { filter:contrast(1.04) brightness(.98); }
  .clipbtn { position:absolute; top:4px; right:4px; background:var(--bg); opacity:.92; }
  .clip figcaption { margin-top:8px; }
  .clip figcaption a { color:inherit; text-decoration:underline; text-underline-offset:3px; }
  dialog.modal.reader { width:100%; max-width:none; height:100dvh; max-height:none; margin:0; border-radius:0; flex-direction:column; }
  dialog.modal.reader[open] { display:flex; }
  dialog.modal.reader .dhead { height:calc(56px + env(safe-area-inset-top, 0px)); padding-top:env(safe-area-inset-top, 0px); }
  .rscroll { flex:1; overflow:auto; background:var(--bg); -webkit-overflow-scrolling:touch; }
  .rscroll img { display:block; max-width:none; height:auto; background:#fff; }
  a.btn { text-decoration:none; }
  .scopebox { margin:0 0 24px; }
  .scopebox p { margin:4px 0 0; font-size:15px; line-height:22px; }
  .btn.primary { background:var(--accent); color:var(--on-accent); }
  .btn.go { background:var(--go); color:var(--on-go); }
  .linkbtn { display:block; margin:12px 0 0; padding:8px 0; border:0; background:none; color:var(--muted); font:400 13px/18px var(--sans); text-decoration:underline; text-align:left; cursor:pointer; }
  /* Beeld onder de titel: altijd dezelfde maat, schuift mee met de tab */
  .hero { position:relative; aspect-ratio:579/274; overflow:hidden; background:var(--surface); }
  /* Eén kleurwaas over alle beelden, met een verloop naar de achtergrond onderaan */
  .hero::before { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:#5a7186; mix-blend-mode:color; opacity:.55; }
  .hero::after { content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:linear-gradient(to top, var(--bg) 0, transparent 38%); }
  .track { display:flex; height:100%; transition:transform .35s ease-out; }
  .slide { flex:0 0 100%; height:100%; background:var(--surface); }
  .slide img { display:block; width:100%; height:100%; object-fit:cover; filter:contrast(1.04) brightness(.88); }
  :root[data-theme=light] .slide img { filter:contrast(1.04) brightness(.98); }
  .slide img.err { visibility:hidden; }
  @media (prefers-reduced-motion:reduce) { .track { transition:none; } }

  /* Vaste knop onderaan: altijd zichtbaar, ook als de tekst langer is dan het scherm */
  .cta { position:fixed; left:env(safe-area-inset-left, 0px); right:env(safe-area-inset-right, 0px); bottom:0; z-index:5; pointer-events:none; }
  .cta .wrap { padding:24px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 65%, transparent); }
  .cta .btn { width:100%; pointer-events:auto; }

  /* Formulier in een gecentreerd venster */
  dialog.modal { width:calc(100% - 32px); max-width:480px; max-height:calc(100dvh - 32px); margin:auto; padding:0; border:0; border-radius:var(--radius); background:var(--surface); color:var(--ink); overflow:auto; }
  dialog.modal::backdrop { background:rgba(0,0,0,.6); }
  .dhead { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 4px 0 16px; background:var(--surface); }
  .dhead .icon { margin:0; color:var(--ink); }
  .dbody { padding:0 16px 16px; }
  .boom { margin:0 0 8px; line-height:0; }
  .boom img { display:block; width:96px; height:auto; }
  .stack { display:grid; gap:12px; }
  .ghl { margin:16px 0 0; font:400 13px/18px var(--sans); }
  .ghl a { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; }
  .ghl a:hover span { text-decoration:underline; }
  .modal input[type=text], .modal textarea, .modal .pad, .modal .btn:not(.primary) { background:var(--bg); }
</style>
</head>

        }
      }
      out += e2(pts[0][0]) + e2(pts[0][1]) + e2(steps.length) + steps.map(([a, b]) => d1(a) + d1(b)).join('');
    });
    return out + '.';
  }
  // De mail volgt de taal van de bezoeker; de samenvoegtool herkent NL en EN
  const mailBody = e => [
    t('mail_hello'),
    '',
    t('m_name') + ': ' + e.name,
    t('m_address') + ': ' + e.address,
    t('m_note') + ': ' + e.note,
    t('m_time') + ': ' + e.ts,
    '',
    t('m_sig') + ':',
    signatureCode()
  ].join('\r\n');

  // Invoer opschonen: stuurtekens, onzichtbare en richting-omkerende tekens eruit, regeleinden naar spatie, max 256
  const clean = s => String(s)
    .replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u202A-\u202E\u2028\u2029\u2066-\u2069\uFEFF]+/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 256);

  ['name', 'street', 'housenr'].forEach(id => $(id).addEventListener('input', () => $(id).classList.remove('invalid')));

  // Controle van de drie verplichte velden; geeft de invoer terug, of null met een melding
  function collect() {
    const name = clean($('name').value), street = clean($('street').value), nr = clean($('housenr').value);
    const address = (street + ' ' + nr).trim();
    const missing = [];
    if (!name) missing.push(['name', $('name')]);
    if (!street) missing.push(['street', $('street')]);
    if (!nr) missing.push(['housenr', $('housenr')]);
    if (!dirty) missing.push(['signature', $('padbox')]);
    ['name', 'street', 'housenr', 'padbox'].forEach(id => $(id).classList.remove('invalid'));
    if (missing.length) {
      missing.forEach(([, el]) => el.classList.add('invalid'));
      setMsg(t('err_missing') + missing.map(([k]) => t(k).toLowerCase()).join(', ') + '.', true);
      missing[0][1].scrollIntoView({ block: 'center' });
      if (missing[0][1].focus) missing[0][1].focus();
      return null;
    }
    return { name, address, note: clean($('note').value), ts: new Date().toISOString() };
  }

  $('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const entry = collect(); if (!entry) return;
    const url = 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(t('m_subject')) +
      '&body=' + encodeURIComponent(mailBody(entry));
    window.location.href = url;
    dlg.close(); resetForm(); openModal($('thx'));
  });

  $('wa').addEventListener('click', () => {            // WhatsApp opent met het bericht klaar; de bezoeker kiest zelf de ontvanger
    const entry = collect(); if (!entry) return;
    window.location.href = 'https://wa.me/?text=' + encodeURIComponent(t('m_subject') + '\n\n' + mailBody(entry));
    dlg.close(); resetForm(); openModal($('thx'));
  });

  $('copy').addEventListener('click', async () => {
    const entry = collect(); if (!entry) return;
    try { await navigator.clipboard.writeText(mailBody(entry)); setMsg(t('ok_copied'), false); }
    catch { setMsg(t('err_copy'), true); }
  });

  document.querySelectorAll('.slide img').forEach(im => im.addEventListener('error', () => im.classList.add('err')));
  resetForm();
  document.documentElement.dataset.theme = store.get('theme') === 'light' ? 'light' : 'dark';
  applyLang();
  fromHash();
})();
</script>
</body>
</html>
